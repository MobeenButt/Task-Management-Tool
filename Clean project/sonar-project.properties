# SonarQube Configuration for Task Management System

# Project identification
sonar.projectKey=task-management-system
sonar.projectName=Task Management System
sonar.projectVersion=1.0

# Source code configuration
sonar.sources=API,Application,Domain,Infrastructure
sonar.tests=Tests

# Language-specific settings
sonar.cs.opencover.reportsPaths=Tests/TestResults/**/coverage.opencover.xml
sonar.cs.vstest.reportsPaths=Tests/TestResults/**/*.trx

# Exclusions
sonar.exclusions=**/bin/**,**/obj/**,**/wwwroot/**,**/*.min.js,**/*.min.css
sonar.test.exclusions=**/bin/**,**/obj/**

# Coverage exclusions
sonar.coverage.exclusions=**/Program.cs,**/Startup.cs,**/*Dto.cs,**/*Request.cs,**/*Response.cs,**/Migrations/**

# Quality gate settings
sonar.qualitygate.wait=true

# Code analysis rules
sonar.cs.analyzer.projectOutPaths=**/bin/**,**/obj/**

# Encoding
sonar.sourceEncoding=UTF-8

# Additional settings for .NET projects
sonar.dotnet.excludeTestProjects=true